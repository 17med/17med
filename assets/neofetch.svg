<svg xmlns="http://www.w3.org/2000/svg" width="960" height="730" viewBox="0 0 960 730">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dcfff"/>
      <stop offset="50%" stop-color="#bb9af7"/>
      <stop offset="100%" stop-color="#f7768e"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.03"/>
    </pattern>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="0.9" fill="#1f2335"/>
    </pattern>
    <clipPath id="win"><rect x="10" y="10" width="940" height="710" rx="14"/></clipPath>
    <clipPath id="lane"><rect x="30" y="596" width="900" height="70" rx="10"/></clipPath>
  </defs>

  <style>
    /* 🎨 avatar palette: edit these to look like you */
    .hair  { fill: #3d2b24; }
    .skin  { fill: #e0ac82; }
    .shade { fill: #c48b62; }
    .eyes  { fill: #1a1b26; }
    .mouth { fill: #a8554a; }
    .hood  { fill: #7aa2f7; }
    .str   { fill: #c0caf5; }
    .band  { fill: #414868; }
    .cup   { fill: #565f89; }

    text { font-family: 'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'Courier New',monospace; white-space: pre; }
    .p { font-size: 14px; fill: #c0caf5; }
    .usr { fill: #9ece6a; font-weight: 700; }
    .dir { fill: #7aa2f7; font-weight: 700; }
    .i { font-size: 13px; }
    .s { font-size: 11px; }
    .k { fill: #7aa2f7; font-weight: 700; }
    .v { fill: #c0caf5; }
    .dim { fill: #565f89; }
    .ok { fill: #9ece6a; }
    .warn { fill: #e0af68; }
    .panel { fill: #11131c; stroke: #1f2335; }

    .fade  { opacity: 0; animation: fade .5s ease-out forwards; }
    .out   { animation: out .3s ease-in forwards; }
    .typer { animation: type .8s steps(8) .5s forwards; }
    .cur   { animation: blink 1s steps(1) infinite; }
    .led   { animation: blink 1.2s steps(1) infinite; }
    .led2  { animation: blink 1.2s steps(1) -.6s infinite; }
    .spin  { animation: blink .16s steps(1) infinite; }
    .spin2 { animation: blink .16s steps(1) -.08s infinite; }
    .lid   { opacity: 0; animation: lid 4.5s infinite 2s; }
    .bob   { animation: bob 2.4s ease-in-out infinite; }
    .look  { animation: look 3s ease-in-out infinite; }
    .msg   { opacity: 0; animation: msg 9s linear infinite; }
    .draw  { stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw 2.2s ease-out 3.6s forwards; }
    .drive { animation: drive 14s linear infinite; }
    .fly   { animation: fly 9s linear infinite; }
    .beam  { animation: beam 1.4s ease-in-out infinite; }

    @keyframes fade  { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes out   { to { opacity: 0; } }
    @keyframes type  { to { transform: translateX(70px); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes lid   { 0%, 92% { opacity: 0; } 94%, 97% { opacity: 1; } 99%, 100% { opacity: 0; } }
    @keyframes bob   { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes look  { 0%, 100% { transform: translateX(0); } 30% { transform: translateX(1px); } 70% { transform: translateX(-1px); } }
    @keyframes msg   { 0% { opacity: 0; } 3% { opacity: 1; } 30% { opacity: 1; } 33.3% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes draw  { to { stroke-dashoffset: 0; } }
    @keyframes drive { from { transform: translateX(-70px); } to { transform: translateX(960px); } }
    @keyframes fly   { from { transform: translateX(980px); } to { transform: translateX(-60px); } }
    @keyframes beam  { 0%, 100% { opacity: .06; } 50% { opacity: .2; } }
  </style>

  <!-- ═══ window ═══ -->
  <rect x="10" y="10" width="940" height="710" rx="14" fill="#0b0e14" stroke="#1f2335" stroke-width="1.5"/>
  <g clip-path="url(#win)">
    <rect x="10" y="10" width="940" height="38" fill="#11131c"/>
    <line x1="10" y1="48" x2="950" y2="48" stroke="#1f2335"/>
  </g>
  <circle cx="36" cy="29" r="6" fill="#f7768e"/>
  <circle cx="58" cy="29" r="6" fill="#e0af68"/>
  <circle cx="80" cy="29" r="6" fill="#9ece6a"/>
  <text x="480" y="34" text-anchor="middle" class="dim" font-size="12">17med@tunis: ~ — zsh — 120×40</text>

  <!-- ═══ command ═══ -->
  <text class="p" x="30" y="82"><tspan class="usr">17med@tunis</tspan><tspan class="v">:</tspan><tspan class="dir">~</tspan><tspan class="v">$ neofetch</tspan></text>
  <rect class="typer" x="155" y="68" width="80" height="20" fill="#0b0e14"/>

  <!-- ═══ avatar panel ═══ -->
  <g class="fade" style="animation-delay:1.3s">
    <rect x="30" y="104" width="320" height="302" rx="10" class="panel"/>
    <rect x="31" y="105" width="318" height="300" rx="10" fill="url(#dots)"/>
    <text x="44" y="128" class="s dim">~/me.png</text>
    <text x="336" y="128" class="s dim" text-anchor="end">16×18 · 8x</text>

    <!-- pixel me -->
    <g transform="translate(64 170) scale(8)" shape-rendering="crispEdges">
      <path class="band" d="M4 0h8v1h-8z M3 1h1v1h-1z M12 1h1v1h-1z M2 2h1v3h-1z M13 2h1v3h-1z M2 8h1v1h-1z M13 8h1v1h-1z"/>
      <path class="hair" d="M4 1h8v1h-8z M3 2h10v2h-10z M3 4h2v1h-2z M6 4h2v1h-2z M10 4h3v1h-3z"/>
      <path class="skin" d="M5 4h1v1h-1z M8 4h2v1h-2z M3 5h10v1h-10z M3 6h1v1h-1z M6 6h4v1h-4z M12 6h1v1h-1z M3 7h10v1h-10z M3 8h4v1h-4z M9 8h4v1h-4z M3 9h10v1h-10z M3 10h3v1h-3z M10 10h3v1h-3z M4 11h8v1h-8z"/>
      <path class="shade" d="M7 8h2v1h-2z M6 12h4v1h-4z"/>
      <path class="eyes" d="M4 6h2v1h-2z M10 6h2v1h-2z"/>
      <path class="skin lid" d="M4 6h2v1h-2z M10 6h2v1h-2z"/>
      <path class="mouth" d="M6 10h4v1h-4z"/>
      <path class="cup" d="M1 5h2v3h-2z M13 5h2v3h-2z"/>
      <rect class="led" x="1" y="6" width="1" height="1" fill="#9ece6a"/>
      <rect class="led2" x="14" y="6" width="1" height="1" fill="#bb9af7"/>
      <path class="hood" d="M3 13h10v1h-10z M2 14h4v1h-4z M7 14h2v2h-2z M10 14h4v1h-4z M1 15h5v1h-5z M10 15h5v1h-5z M1 16h14v2h-14z"/>
      <path class="str" d="M6 14h1v2h-1z M9 14h1v2h-1z"/>
    </g>

    <!-- robot sidekick -->
    <g class="bob">
      <g transform="translate(236 242) scale(6)" shape-rendering="crispEdges">
        <rect class="led" x="4" y="0" width="1" height="1" fill="#9ece6a"/>
        <path fill="#565f89" d="M4 1h1v1h-1z M3 7h4v1h-4z"/>
        <path fill="#c0caf5" d="M2 2h6v1h-6z M1 3h8v1h-8z M1 4h1v2h-1z M8 4h1v2h-1z M1 6h8v1h-8z"/>
        <path fill="#1a1b26" d="M2 4h6v2h-6z"/>
        <path class="look" fill="#7dcfff" d="M3 4h1v1h-1z M6 4h1v1h-1z"/>
        <path fill="#a9b1d6" d="M1 8h8v1h-8z M0 9h10v1h-10z M0 10h1v1h-1z M2 10h6v1h-6z M9 10h1v1h-1z M2 11h2v1h-2z M6 11h2v1h-2z"/>
        <rect class="led2" x="4" y="9" width="2" height="1" fill="#f7768e"/>
      </g>
    </g>

    <!-- speech bubble -->
    <rect x="206" y="196" width="136" height="26" rx="6" fill="#1a1b26" stroke="#2f3549"/>
    <path d="M262 221 l8 9 l3 -9z" fill="#1a1b26"/>
    <text class="msg" x="274" y="213" font-size="10" fill="#9ece6a" text-anchor="middle" style="animation-delay:0s">beep · all pods green</text>
    <text class="msg" x="274" y="213" font-size="10" fill="#7dcfff" text-anchor="middle" style="animation-delay:-6s">infra is code ♥</text>
    <text class="msg" x="274" y="213" font-size="10" fill="#bb9af7" text-anchor="middle" style="animation-delay:-3s">kubectl apply -f me</text>

    <line x1="56" y1="318" x2="324" y2="318" stroke="#2f3549" stroke-dasharray="4 4"/>
    <text x="190" y="350" font-size="12" font-weight="700" fill="url(#g)" text-anchor="middle">devops · infra · ai · robotics</text>
    <text x="190" y="378" class="s" text-anchor="middle"><tspan class="ok">●</tspan><tspan class="dim"> all systems nominal</tspan></text>
  </g>

  <!-- ═══ info ═══ -->
  <text class="p fade" x="390" y="114" style="animation-delay:1.4s"><tspan class="usr">17med</tspan><tspan class="v">@</tspan><tspan class="dir">tunis</tspan></text>
  <text class="dim fade" x="390" y="130" font-size="13" style="animation-delay:1.45s">────────────────────────────────────────</text>

  <text class="i fade" x="390" y="152" style="animation-delay:1.50s"><tspan class="k">Name</tspan><tspan x="492" class="v">Ahmed Dhia Ben Achour</tspan></text>
  <text class="i fade" x="390" y="172" style="animation-delay:1.59s"><tspan class="k">Base</tspan><tspan x="492" class="v">Tunis, Tunisia</tspan></text>
  <text class="i fade" x="390" y="192" style="animation-delay:1.68s"><tspan class="k">Role</tspan><tspan x="492" class="v">DevOps · Infra · AI · Robotics</tspan></text>
  <text class="i fade" x="390" y="212" style="animation-delay:1.77s"><tspan class="k">Uptime</tspan><tspan x="492" class="v">shipping code since 2021</tspan></text>
  <text class="i fade" x="390" y="232" style="animation-delay:1.86s"><tspan class="k">Shell</tspan><tspan x="492" class="v">TypeScript · Python · C++ · C#</tspan></text>
  <text class="i fade" x="390" y="252" style="animation-delay:1.95s"><tspan class="k">Infra</tspan><tspan x="492" class="v">Kubernetes · Docker · Ansible · Nginx · WireGuard</tspan></text>
  <text class="i fade" x="390" y="272" style="animation-delay:2.04s"><tspan class="k">Cloud</tspan><tspan x="492" class="v">AWS · Azure · GCP · OpenStack · Cloudflare · OVH</tspan></text>
  <text class="i fade" x="390" y="292" style="animation-delay:2.13s"><tspan class="k">Observe</tspan><tspan x="492" class="v">Prometheus · Grafana · SonarQube</tspan></text>
  <text class="i fade" x="390" y="312" style="animation-delay:2.22s"><tspan class="k">CI/CD</tspan><tspan x="492" class="v">GitHub Actions · Gitea · Jest · Cypress</tspan></text>
  <text class="i fade" x="390" y="332" style="animation-delay:2.31s"><tspan class="k">AI/ML</tspan><tspan x="492" class="v">PyTorch · TensorFlow · Keras · CUDA · MLflow</tspan></text>
  <text class="i fade" x="390" y="352" style="animation-delay:2.40s"><tspan class="k">Robotics</tspan><tspan x="492" class="v">ESP32 · Arduino · MicroPython</tspan></text>
  <text class="i fade" x="390" y="372" style="animation-delay:2.49s"><tspan class="k">Data</tspan><tspan x="492" class="v">Postgres · Redis · Cassandra · Kafka · Neo4j</tspan></text>
  <text class="i fade" x="390" y="392" style="animation-delay:2.58s"><tspan class="k">Web</tspan><tspan x="492" class="v">React · Next.js · NestJS · FastAPI · Bun</tspan></text>
  <text class="i fade" x="390" y="412" style="animation-delay:2.67s"><tspan class="k">Homelab</tspan><tspan x="492" class="v">Jellyfin · Pi-hole · Bitwarden · Plex</tspan></text>

  <!-- ═══ panel 1 · infra ═══ -->
  <g class="fade" style="animation-delay:3.0s">
    <rect x="30" y="430" width="288" height="150" rx="10" class="panel"/>
    <text x="44" y="451" class="s k">❯ kubectl get pods -A</text>
    <line x1="30" y1="461" x2="318" y2="461" stroke="#1f2335"/>
    <text x="44" y="480" class="s dim">NAME</text><text x="196" y="480" class="s dim">STATUS</text>
    <text x="44" y="498" class="s v">api-gateway</text>    <text x="196" y="498" class="s ok">● Running</text>
    <text x="44" y="516" class="s v">ml-inference</text>   <text x="196" y="516" class="s ok">● Running</text>
    <text x="44" y="534" class="s v">robot-ctrl</text>
    <text x="196" y="534" class="s warn out" style="animation-delay:4.6s">◌ Pending</text>
    <text x="196" y="534" class="s ok fade" style="animation-delay:4.9s">● Running</text>
    <text x="44" y="552" class="s v">kafka-broker-0</text> <text x="196" y="552" class="s ok">● Running</text>
    <text x="44" y="570" class="s v">grafana</text>        <text x="196" y="570" class="s ok">● Running</text>
  </g>

  <!-- ═══ panel 2 · robotics ═══ -->
  <g class="fade" style="animation-delay:3.15s">
    <rect x="336" y="430" width="288" height="150" rx="10" class="panel"/>
    <text x="350" y="451" class="s k">❯ ./arm --sweep</text>
    <line x1="336" y1="461" x2="624" y2="461" stroke="#1f2335"/>

    <rect x="378" y="556" width="44" height="10" rx="2" fill="#414868"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-25 400 556;25 400 556;-25 400 556" keyTimes="0;.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" dur="5s" repeatCount="indefinite"/>
      <line x1="400" y1="556" x2="400" y2="506" stroke="#7aa2f7" stroke-width="7" stroke-linecap="round"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-35 400 506;35 400 506;-35 400 506" keyTimes="0;.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" dur="3.3s" repeatCount="indefinite"/>
        <line x1="400" y1="506" x2="446" y2="506" stroke="#7dcfff" stroke-width="5" stroke-linecap="round"/>
        <path d="M446 506 l9 -6 M446 506 l9 6" stroke="#c0caf5" stroke-width="3" stroke-linecap="round" fill="none"/>
      </g>
      <circle cx="400" cy="506" r="5" fill="#bb9af7"/>
    </g>
    <circle cx="400" cy="556" r="6" fill="#bb9af7"/>

    <text x="492" y="488" class="s"><tspan class="dim">joint[0]</tspan><tspan x="556" class="v">±25°</tspan></text>
    <text x="492" y="506" class="s"><tspan class="dim">joint[1]</tspan><tspan x="556" class="v">±35°</tspan></text>
    <text x="492" y="524" class="s"><tspan class="dim">mode</tspan><tspan x="556" class="v">auto</tspan></text>
    <text x="492" y="542" class="s"><tspan class="dim">link</tspan><tspan x="556" class="ok">● up</tspan></text>
  </g>

  <!-- ═══ panel 3 · ai ═══ -->
  <g class="fade" style="animation-delay:3.3s">
    <rect x="642" y="430" width="288" height="150" rx="10" class="panel"/>
    <text x="656" y="451" class="s k">❯ python train.py</text>
    <text x="916" y="451" class="s dim" text-anchor="end">gpu 97%</text>
    <line x1="642" y1="461" x2="930" y2="461" stroke="#1f2335"/>
    <line x1="656" y1="540" x2="904" y2="540" stroke="#2f3549"/>
    <line x1="656" y1="468" x2="656" y2="540" stroke="#2f3549"/>
    <polyline class="draw" pathLength="100" fill="none" stroke="url(#g)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"
      points="656,472 680,497 705,507 729,520 754,523 778,530 802,531 827,534 851,533 876,535 900,536"/>
    <text x="656" y="565" class="s"><tspan class="dim">epoch</tspan><tspan class="v"> 100/100 </tspan><tspan class="ok">✓</tspan><tspan class="dim">   loss</tspan><tspan class="v"> 0.031</tspan></text>
  </g>

  <!-- ═══ patrol lane · rover + drone ═══ -->
  <g class="fade" style="animation-delay:3.5s">
    <rect x="30" y="596" width="900" height="70" rx="10" class="panel"/>
    <text x="916" y="614" class="s dim" text-anchor="end">❯ ./patrol --zone=homelab</text>
    <line x1="40" y1="661" x2="920" y2="661" stroke="#2f3549" stroke-dasharray="6 6"/>

    <g clip-path="url(#lane)">
      <!-- rover -->
      <g class="drive">
        <g transform="translate(0 624) scale(4)" shape-rendering="crispEdges">
          <path fill="#1a1b26" d="M11 0h2v1h-2z"/>
          <rect class="led" x="12" y="0" width="1" height="1" fill="#7dcfff"/>
          <path fill="#565f89" d="M11 1h1v1h-1z M2 5h1v1h-1z M7 5h1v1h-1z M12 5h1v1h-1z"/>
          <path fill="#3d59a1" d="M2 2h12v1h-12z"/>
          <path fill="#c0caf5" d="M1 3h14v2h-14z"/>
          <rect x="14" y="4" width="1" height="1" fill="#e0af68"/>
          <path fill="#414868" d="M1 6h3v3h-3z M6 6h3v3h-3z M11 6h3v3h-3z"/>
          <path class="spin" fill="#7aa2f7" d="M2 7h1v1h-1z M7 7h1v1h-1z M12 7h1v1h-1z"/>
        </g>
      </g>

      <!-- drone -->
      <g class="fly">
        <g class="bob">
          <g transform="translate(0 600) scale(3)" shape-rendering="crispEdges">
            <polygon class="beam" points="5,7 9,7 12,20 2,20" fill="#7dcfff"/>
            <path class="spin"  fill="#565f89" d="M0 0h5v1h-5z M9 0h5v1h-5z"/>
            <path class="spin2" fill="#565f89" d="M1 0h3v1h-3z M10 0h3v1h-3z"/>
            <path fill="#565f89" d="M2 1h1v2h-1z M11 1h1v2h-1z"/>
            <path fill="#bb9af7" d="M3 2h8v1h-8z M3 3h2v1h-2z M9 3h2v1h-2z M4 4h6v1h-6z"/>
            <path fill="#1a1b26" d="M5 3h4v1h-4z"/>
            <rect class="led" x="7" y="3" width="1" height="1" fill="#f7768e"/>
            <path fill="#414868" d="M5 5h1v1h-1z M8 5h1v1h-1z M4 6h2v1h-2z M8 6h2v1h-2z"/>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- ═══ final prompt ═══ -->
  <g class="fade" style="animation-delay:3.9s">
    <text class="p" x="30" y="700"><tspan class="usr">17med@tunis</tspan><tspan class="v">:</tspan><tspan class="dir">~</tspan><tspan class="v">$ </tspan></text>
    <rect class="cur" x="157" y="687" width="9" height="17" fill="#c0caf5"/>
  </g>

  <!-- crt scanlines -->
  <rect x="10" y="48" width="940" height="672" fill="url(#scan)" clip-path="url(#win)" pointer-events="none"/>
</svg>
